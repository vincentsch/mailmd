mail_home=/srv/mail/%Lu
mail_location=sdbox:~/Mail
mail_uid=1000
mail_gid=1000
protocols = imap lmtp
first_valid_uid = 1000
last_valid_uid = 1000
passdb {
  driver = static
  args = password=pass
}
ssl = yes
ssl_cert = </etc/dovecot/tls/srv.pem
ssl_key = </etc/dovecot/tls/srv.key
namespace inbox {
  inbox = yes
  separator = /
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}
service lmtp {
  inet_listener {
    port = 24
  }
}
mail_max_userip_connections = 100
listen = *
log_path=/dev/stdout
info_log_path=/dev/stdout
